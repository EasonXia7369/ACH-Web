name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build
        # VITE_API_BASE 来自 .env.production

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name ach-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26d1e756e9375f14b9aaefc8d5cc6ed5
